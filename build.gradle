plugins {
    id 'com.gtnewhorizons.gtnhgradle' version '2.0.31'
}

def dhBuild = gradle.includedBuild('dh')
def dhProps = new Properties()
file('dh/gradle.properties').withInputStream { dhProps.load(it) }

group = modGroup
version = "${dhProps.mod_version}-java8-native.${dhProps.java8_port_version}"
ext.modVersion = version.toString()

def sourceName = "${modName}-${dhProps.mod_version}-java8-native-${dhProps.java8_port_version}-${minecraftVersion}"

// The publishers want TaskProvider<Jar>, but the jars are DH's -- clear Jar's own
// packaging action and copy them byte-for-byte instead.
def registerJarCopy = { String taskName, FileCollection source, String classifier ->
    tasks.register(taskName, Jar) {
        archiveFileName.set("${sourceName}${classifier}.jar")
        inputs.files(source)

        actions.clear()
        doLast {
            copy {
                from source.singleFile
                into destinationDirectory
                rename { archiveFileName.get() }
            }
        }
    }
}

def dhReleaseJar = files("dh/${dhLoader}/build/libs/${sourceName}.jar")
        .builtBy(dhBuild.task(":${dhLoader}:assemble"))
def collectJars = registerJarCopy('collectJars', dhReleaseJar, '')
def releaseJar = collectJars.flatMap { it.archiveFile }

// Deobfuscate DH's release jar for use as the published compile-time dev jar.
def deobfJar = configurations.detachedConfiguration(dependencies.create(modUtils.deobfuscate(files(releaseJar))))
configurations.runtimeClasspath.attributes.keySet().each { attribute ->
    deobfJar.attributes.attribute(attribute, configurations.runtimeClasspath.attributes.getAttribute(attribute))
}

def collectDevJars = registerJarCopy('collectDevJars', deobfJar, '-dev')
def devJar = collectDevJars.flatMap { it.archiveFile }

tasks.named('jar') { enabled = false }
['apiElements', 'runtimeElements'].each { name ->
    configurations.named(name) {
        outgoing.artifacts.clear()
        outgoing.artifact(releaseJar) { builtBy collectJars }
    }
}

gtnhGradle.applyModuleByName(project, 'PublishingModule')

publishing.publications.named('maven') {
    artifactId = System.getenv('ARTIFACT_ID') ?: modName
    artifact(devJar) {
        classifier = 'dev'
        builtBy collectDevJars
    }
}

afterEvaluate {
    publishing.publications.named('maven') { version = project.version }
}

tasks.named('assemble') {
    setDependsOn([])
    dependsOn collectJars, collectDevJars
}
tasks.named('check') {
    // This wrapper has no sources/tests; verification belongs to the DH build.
    setDependsOn([])
    dependsOn dhBuild.task(":${dhLoader}:check"), dhBuild.task(':core:test'), dhBuild.task(':api:test')
}
tasks.named('clean') {
    dependsOn dhBuild.task(':clean'), dhBuild.task(":${dhLoader}:clean")
}

// Keep RFG from preparing Minecraft for this source-less wrapper project.
['compileClasspath', 'testCompileClasspath', 'runtimeClasspath', 'testRuntimeClasspath'].each { name ->
    configurations.named(name) { setExtendsFrom([]) }
}
tasks.named('setupCIWorkspace') { setDependsOn([]) }
