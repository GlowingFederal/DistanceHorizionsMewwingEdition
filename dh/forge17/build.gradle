plugins {
    id 'unimined-forge17'
}

repositories {
    mavenLocal()
    maven {
        name "GTNH Maven"
        url "https://nexus.gtnewhorizons.com/repository/public/" // UniMixins
        content {
            includeGroup "com.github.GTNewHorizons"
            includeGroup "io.github.legacymoddingmc"
        }
    }
    maven {
        name = "mavenpattern"
        url = "https://mvn.falsepattern.com/releases" // RPLE
        content {
            includeGroup "com.falsepattern"
        }
    }
}

// ==================== Mod Dependency Helper ====================

def addMod(path, enabled) {
    // GTNH dev jars use different MCP names from this project's stable mappings.
    // Select the SRG release artifact explicitly for Unimined to remap at runtime;
    // GTNH's default Gradle metadata otherwise selects the dev artifact.
    if (enabled == "2")
        dependencies { modImplementation("${path}@jar") { transitive = false } }
    else if (enabled == "1")
        dependencies { modCompileOnly("${path}:dev") { transitive = false } }
}


// ==================== Dependencies ====================

dependencies {
    modCompileOnly "com.github.GTNewHorizons:Hodgepodge:2.7.13:dev"
    addMod("com.github.GTNewHorizons:GTNHLib:0.11.47", rootProject.enable_angelica == "2" ? "2" : "1")
    modCompileOnly("com.github.GTNewHorizons:GT5-Unofficial:5.09.51.469:dev") { transitive = false }
    addMod("com.github.GTNewHorizons:Angelica:2.2.12", rootProject.enable_angelica)
    modCompileOnly "com.falsepattern:rple-mc1.7.10:2.1.0:api"
    
    modImplementation "io.github.legacymoddingmc:unimixins:0.2.1@jar"

}

// ==================== Tasks ====================

// Only the remapped JAR is installable. Keep all intermediate/dev archives distinct.
tasks.named('remapJar') {
    archiveFileName.set("${rootProject.java8EditionArchiveName}.jar")
}

shadowJar {
    // Forge 1.7.10's ASM 5 scanner inspects every class, including multi-release
    // entries that a Java 8 JVM itself would ignore. Keep only the Java 8 variants.
    exclude 'META-INF/versions/**', '**/module-info.class'
}

task deleteResources(type: Delete) {
    delete file("build/resources/main")
}

processResources {
    dependsOn(copyCoreResources)
    from(convertJsonToLang) { into 'assets/distanthorizons/lang' }
    // dependsOn(copyCommonLoaderResources)

    from(project(":common").file("src/main/resources/${gradle.ext.accessWidenerVersion}.distanthorizons_at.cfg")) {
        into 'META-INF'
    }
}

tasks.named('runClient') {
    dependsOn(copyCoreResources)
    // dependsOn(copyCommonLoaderResources)
    finalizedBy(deleteResources)
}

sourcesJar {
    def commonSources = project(":common").sourcesJar
    dependsOn commonSources
    from(commonSources.archiveFile.map { zipTree(it) }) {
        exclude "com/seibel/distanthorizons/lwjgl/LWJGLServiceProvider.java"
    }
}

// Guard the standalone legacy release boundary, including bundled libraries.
tasks.register('verifyLegacyJar') {
    group = 'verification'
    description = 'Verify Java 8 bytecode and native LWJGL 2-only release packaging.'
    dependsOn tasks.named('remapJar')
    inputs.file(tasks.named('remapJar').flatMap { it.archiveFile })
    doLast {
        def forbiddenDependencies = configurations.runtimeClasspath.resolvedConfiguration.resolvedArtifacts.findAll {
            def id = it.moduleVersion.id
            id.group == 'org.lwjgl' || (id.name.toLowerCase() =~ /lwjgl3ify|glfw|retrofuturabootstrap/).find()
        }
        if (!forbiddenDependencies.empty) {
            throw new GradleException("Unexpected legacy runtime dependencies: ${forbiddenDependencies}")
        }

        def release = tasks.named('remapJar').get().archiveFile.get().asFile
        if (release.name != "${rootProject.java8EditionArchiveName}.jar") {
            throw new GradleException("Unexpected production filename: ${release.name}")
        }
        new java.util.jar.JarFile(release).withCloseable { jar ->
            def metadata = new groovy.json.JsonSlurper().parse(jar.getInputStream(jar.getJarEntry('mcmod.info')))[0]
            if (metadata.modid != rootProject.mod_id || metadata.name != rootProject.java8_edition_name ||
                metadata.version != rootProject.java8EditionVersion || metadata.mcversion != rootProject.minecraft_version) {
                throw new GradleException("Unexpected Forge release metadata: ${metadata}")
            }
            [
                'Implementation-Title': rootProject.java8_edition_name,
                'Implementation-Version': rootProject.java8EditionVersion,
                'DH-Upstream-Version': rootProject.mod_version,
                'Java8-Port-Version': rootProject.java8_port_version,
                'Java8-Release-Channel': rootProject.java8_release_channel,
                'FMLCorePlugin': 'com.seibel.distanthorizons.DistantHorizonsTweaker',
                'FMLCorePluginContainsFMLMod': 'true',
                'ForceLoadAsMod': 'true',
                'FMLAT': '1_7_10.distanthorizons_at.cfg'
            ].each { key, expected ->
                if (jar.manifest.mainAttributes.getValue(key) != expected.toString()) {
                    throw new GradleException("Unexpected manifest attribute ${key}")
                }
            }
            def names = jar.entries().collect { it.name }
            def forbidden = names.findAll {
                it.startsWith('org/lwjgl/') || it.contains('/lwjgl/lwjgl3/') ||
                    it.toLowerCase().contains('glfw') || it.toLowerCase().contains('lwjgl3ify') ||
                    it.contains('retrofuturabootstrap')
            }
            if (!forbidden.empty) {
                throw new GradleException("Unexpected LWJGL/bootstrap payload: ${forbidden}")
            }
            names.findAll {
                it.endsWith('.class')
            }.each { name ->
                jar.getInputStream(jar.getJarEntry(name)).withCloseable { stream ->
                    def data = new DataInputStream(stream)
                    if (data.readInt() != (int) 0xCAFEBABE) {
                        throw new GradleException("Invalid class: ${name}")
                    }
                    data.readUnsignedShort()
                    int major = data.readUnsignedShort()
                    if (major > 52) {
                        throw new GradleException("Java 8 cannot load ${name} (class version ${major})")
                    }
                }
            }
            [
                'com/seibel/distanthorizons/lwjgl/lwjgl2/LWJGL2Service.class',
                'com/seibel/distanthorizons/lwjgl/LWJGLServiceProvider.class',
                'DistantHorizons.forge.mixins.json',
                'DistantHorizons.forge.mixins-refmap.json',
                'META-INF/1_7_10.distanthorizons_at.cfg',
                'LICENSE.txt',
                'LICENSE.LESSER.txt',
                'LICENSE-LOGOS.txt',
                'dh_sqlite/native/Windows/x86_64/sqlitejdbc.dll',
                "win/amd64/libzstd-jni_dh-${rootProject.zstd_version}.dll"
            ].each { required ->
                if (!names.contains(required.toString())) {
                    throw new GradleException("Missing legacy release resource: ${required}")
                }
            }
            def refmap = new groovy.json.JsonSlurper().parse(jar.getInputStream(jar.getJarEntry('DistantHorizons.forge.mixins-refmap.json')))
            if (!refmap.mappings) {
                throw new GradleException('Empty release mixin refmap')
            }
            logger.lifecycle("Verified Java 8 / native LWJGL 2 release: ${release}")
        }
    }
}

tasks.named('check') { dependsOn tasks.named('verifyLegacyJar') }
